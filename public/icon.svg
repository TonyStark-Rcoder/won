<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140c2e" />
      <stop offset="60%" stop-color="#080712" />
      <stop offset="100%" stop-color="#030307" />
    </radialGradient>

    <!-- Cyan to Violet Plasma Gradients -->
    <linearGradient id="plasmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#4361ee" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>

    <radialGradient id="runeCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3a0ca3" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#080712" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#241a45" stroke-width="2" />

  <!-- Ambient Core Bloom -->
  <circle cx="256" cy="256" r="180" fill="url(#runeCenter)" />

  <!-- Outer Orbit Energy Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3c1e70" stroke-width="2" stroke-dasharray="8 12" opacity="0.6" />
  
  <!-- Outer Segmented Tech Ring -->
  <g filter="url(#hyperGlow)">
    <circle cx="256" cy="256" r="170" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="60 30 15 30" opacity="0.85" />
    <circle cx="256" cy="256" r="150" fill="none" stroke="#7b2cbf" stroke-width="2.5" stroke-dasharray="90 40 40 40" opacity="0.75" />
  </g>

  <!-- Orbital Node Sparks -->
  <circle cx="256" cy="86" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="426" cy="256" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="256" cy="426" r="5" fill="#9d4edd" filter="url(#neonGlow)" />
  <circle cx="86" cy="256" r="5" fill="#9d4edd" filter="url(#neonGlow)" />

  <!-- Rotating Core Hexagon Frame -->
  <polygon points="256,120 374,188 374,324 256,392 138,324 138,188" 
           fill="#0b0a1a" fill-opacity="0.8" 
           stroke="url(#plasmaGrad)" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Inner Diamond Shards -->
  <polygon points="256,145 352,256 256,367 160,256" 
           fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 6" />

  <!-- Central "N" Glyph - Edgy RPG Anime Blade Stylization -->
  <g filter="url(#hyperGlow)">
    <!-- Left Stela -->
    <path d="M 186 170 L 216 170 L 216 342 L 186 342 Z" fill="url(#coreGrad)" />
    <!-- Diagonal Energy Blade -->
    <polygon points="208,170 238,170 304,342 274,342" fill="url(#plasmaGrad)" />
    <!-- Right Stela -->
    <path d="M 296 170 L 326 170 L 326 342 L 296 342 Z" fill="url(#coreGrad)" />

    <!-- Sharp Tech Chevron accents on N -->
    <polygon points="186,170 200,154 216,170" fill="#00f2fe" />
    <polygon points="326,342 312,358 296,342" fill="#9d4edd" />
    <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <!-- Fine HUD ticks -->
  <line x1="240" y1="120" x2="272" y2="120" stroke="#00f2fe" stroke-width="3" />
  <line x1="240" y1="392" x2="272" y2="392" stroke="#9d4edd" stroke-width="3" />
</svg>
